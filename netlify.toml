# Netlify config for the Quincy Lou site.
# Plain static HTML/CSS/JS, generated by tools/build.py and committed,
# so Netlify needs no build step. The site lives in site/.

[build]
  publish = "site"

# Basic security headers on every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Design concepts are for internal comparison; keep them out of search results.
[[headers]]
  for = "/concept/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
